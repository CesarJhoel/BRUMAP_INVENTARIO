<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Inventario · BRUMAP</title>
  <link rel="icon" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=8.0.0">
  <script type="module" src="/assets/js/app.js?v=8.0.0"></script>
</head>
<body>
  <a class="skip-link" href="#content">Ir al contenido</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Menú principal">
      <a class="brand" href="#dashboard"><img class="brand-symbol brand-image" src="/assets/img/brumap_logo.png" alt=""><span>BRUMAP<small>INVENTARIO</small></span></a>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><span class="online-dot"></span> Control de inventario <small>BRUMAP</small></div>
    </aside>
    <button id="menuOverlay" class="menu-overlay" aria-label="Cerrar menú" hidden></button>
    <div class="workspace">
      <header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">☰</button><span class="breadcrumb">Espacio de trabajo <span>/</span> <strong id="breadcrumb">Resumen</strong></span></div><div class="topbar-actions"><button id="themeToggle" class="icon-button" aria-label="Cambiar tema" title="Cambiar tema"></button><a id="accountLink" class="user-chip" href="#cuenta"><span id="userAvatar" class="avatar">B</span><span id="userName">Cargando…</span></a><button id="logoutButton" class="btn subtle">Salir</button></div></header>
      <main id="content" tabindex="-1"><div class="loading-state" role="status">Cargando tu inventario…</div></main>
      <footer class="workspace-footer"><span>BRUMAP · Control y trazabilidad</span><span id="lastUpdate"></span></footer>
    </div>
  </div>
  <dialog id="formDialog" class="form-dialog" aria-labelledby="dialogTitle"><div class="dialog-header"><div><span class="eyebrow" id="dialogEyebrow">REGISTRO</span><h2 id="dialogTitle"></h2></div><button class="icon-button" id="closeDialog" aria-label="Cerrar formulario">×</button></div><form id="recordForm"><div id="formFields" class="form-grid"></div><p id="formMessage" class="form-message" role="alert"></p><div class="dialog-actions"><button id="cancelDialog" class="btn" type="button">Cancelar</button><button id="saveRecord" class="btn primary" type="submit">Guardar registro</button></div></form></dialog>
  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">Confirmar acción</h2><p id="confirmText"></p><div class="dialog-actions"><button id="confirmCancel" class="btn">Cancelar</button><button id="confirmAccept" class="btn primary">Confirmar</button></div></dialog>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <datalist id="materialSuggestions"></datalist><datalist id="productSuggestions"></datalist>
</body>
</html>
