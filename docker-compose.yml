services:
  brumap_inventario:
    build: .
    container_name: brumap_inventario
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      COOKIE_SECURE: "0"
      SESSION_SECRET: "cambia_esto_por_una_clave_larga_y_segura"
      AUDIT_ENABLED: "1"
      AUDIT_LEVEL: "normal"
      AUDIT_RETENTION_DAYS: "120"
      AUDIT_MAX_ROWS: "15000"
      AUDIT_DETAIL_MAX_CHARS: "350"
    volumes:
      - ./Data:/usr/src/app/Data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
