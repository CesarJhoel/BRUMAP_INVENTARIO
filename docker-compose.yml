services:
  brumap:
    build:
      context: .
      target: runtime
    image: brumap-inventario:8.0.0
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/Data
      SESSION_SECRET: ${SESSION_SECRET:?Ejecuta sh scripts/setup.sh para generar .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Ejecuta sh scripts/setup.sh para generar .env}
      PROTECTED_SUPERVISOR_USERNAME: ${PROTECTED_SUPERVISOR_USERNAME:-supervisor}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-1}
      AUDIT_LEVEL: ${AUDIT_LEVEL:-minimal}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AUDIT_MAX_ROWS: ${AUDIT_MAX_ROWS:-8000}
    volumes:
      - brumap_data:/app/Data
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  brumap_data:
